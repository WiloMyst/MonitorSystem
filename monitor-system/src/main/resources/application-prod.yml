server:
  port: 8080

spring:
  # 数据库连接：使用 docker-compose 中的服务名 mysql-db
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-db}:3306/monitor_system?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

  # Redis 连接：使用 docker-compose 中的服务名 redis-stack
  data:
    redis:
      host: ${REDIS_HOST:redis-stack}
      port: 6379
      password: ${REDIS_PASSWORD:123456}

  # RabbitMQ 连接：使用 docker-compose 中的服务名 rabbitmq
  rabbitmq:
    host: ${MQ_HOST:rabbitmq}
    username: ${MQ_USER:admin}
    password: ${MQ_PASSWORD:123456}

  # AI 配置：Key 通过环境变量传入，不在代码里明文显示
  ai:
    zhipuai:
      api-key: ${ZHIPU_API_KEY}
      chat:
        options:
          model: glm-4-flash
    vectorstore:
      redis:
        # 这里的 URI 也要动态拼装
        uri: redis://:${REDIS_PASSWORD:123456}@${REDIS_HOST:redis-stack}:6379/
        index: monitor_manual_index
        prefix: "rag:doc:"

# 生产环境关闭 SQL 打印，保护性能
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

device:
  alarm:
    # 高温报警阈值
    temp-threshold: 85.0