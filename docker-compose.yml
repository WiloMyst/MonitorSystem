version: '3.8'

networks:
  monitor_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  # ================= 1. 核心数据库 =================
  mysql-db:
    image: mysql:8.0
    container_name: monitor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: monitor_system
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitor_net

  # ================= 2. 向量数据库 (RAG 持久化大脑) =================
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: monitor-redis-stack
    restart: always
    environment:
      REDIS_ARGS: "--requirepass 123456"
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitor_net

  # ================= 3. 消息队列 (硬件高并发缓冲) =================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: monitor-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - monitor_net

  # ================= 4. Java 核心后端 (BFF + 业务) =================
  monitor-backend:
    build: 
      context: ./monitor-system
    container_name: monitor-backend
    restart: always
    depends_on:
      - mysql-db
      - redis-stack
      - rabbitmq
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql-db
      - DB_PASSWORD=123456
      - REDIS_HOST=redis-stack
      - REDIS_PASSWORD=123456
      - MQ_HOST=rabbitmq
      - MQ_PASSWORD=123456
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_INTERNAL_SECRET=${INTERNAL_API_SECRET:-}
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - monitor_net

  # ================= 5. Python AI 微服务 =================
  ai-service:
    build:
      context: ./ai-service
    container_name: monitor-ai-service
    restart: always
    depends_on:
      - redis-stack
      - monitor-backend
    environment:
      - MODEL_PROVIDER=${MODEL_PROVIDER:-zhipu}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      - CHAT_MODEL=${CHAT_MODEL:-glm-4-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-2}
      - REDIS_URL=redis://:123456@redis-stack:6379/0
      - REDIS_INDEX_NAME=monitor_manual_index
      - JAVA_BACKEND_URL=http://monitor-backend:8080
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=monitor_system
      - SECURITY_PROMPT_INJECTION_DEFENSE=${SECURITY_PROMPT_INJECTION_DEFENSE:-true}
      - SECURITY_SENSITIVE_WORD_FILTER=${SECURITY_SENSITIVE_WORD_FILTER:-true}
      - TZ=Asia/Shanghai
    volumes:
      - ./ai-service/resources/docs:/app/resources/docs
    networks:
      - monitor_net

  # ================= 6. Vue 监控大屏前端 =================
  monitor-frontend:
    build: 
      context: ./monitor-system-ui
    container_name: monitor-frontend
    restart: always
    depends_on:
      - monitor-backend
    ports:
      - "80:80"
    networks:
      - monitor_net